name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - name: Sync keymaps docs from config.lua
        run: pnpm gen:docs
      - name: Commit regenerated docs if stale
        run: |
          if ! git diff --exit-code -- README.md wiki/Keymaps.md wiki/Configuration.md; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md wiki/Keymaps.md wiki/Configuration.md
            git commit -m "chore: sync keymaps docs [skip ci]"
            git push || echo "⚠️ Could not auto-push (PR from fork?). Run 'pnpm gen:docs' locally."
          fi
      - name: Sync to GitHub Wiki
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git /tmp/wiki
          cp wiki/Home.md wiki/Installation.md wiki/Configuration.md wiki/Keymaps.md /tmp/wiki/
          cd /tmp/wiki
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Home.md Installation.md Configuration.md Keymaps.md
            git commit -m "sync docs from telegram.nvim@${{ github.sha }}"
            git push
            echo "✅ Wiki synced"
          else
            echo "✅ Wiki already up to date"
          fi
