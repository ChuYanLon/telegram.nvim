name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - name: Sync keymaps docs from config.lua
        run: pnpm gen:docs
      - name: Commit regenerated docs if stale
        run: |
          if ! git diff --exit-code -- README.md wiki/Keymaps.md wiki/Configuration.md; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md wiki/Keymaps.md wiki/Configuration.md
            git commit -m "chore: sync keymaps docs [skip ci]"
            git push || echo "⚠️ Could not auto-push (PR from fork?). Run 'pnpm gen:docs' locally."
          fi
